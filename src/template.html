<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="app-title"><h1>Weather App</h1></div>
    <div class="container">
      <form action="#" id="search-location-form">
        <input
          type="text"
          name="location"
          id="location"
          placeholder="Search for a location or city (e.g Dhaka, London, etc)"
        />
        <button type="submit" id="search-btn">Search</button>
      </form>
      <button id="toggle-unit-btn">
        <span class="celcius">°C</span>/<span class="farenheit active">°F</span>
      </button>
    </div>
    <div class="display-container"></div>
  </body>
</html>
